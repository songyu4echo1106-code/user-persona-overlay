<div id="user_persona_overlay_settings" class="upo-container">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-i18n="User Persona Overlay">User Persona Overlay</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="upo-label" data-i18n="悬浮窗">悬浮窗</label>
            <label class="checkbox_label" for="upo_floating_enabled">
                <input id="upo_floating_enabled" type="checkbox" />
                <span data-i18n="启用悬浮窗">启用悬浮窗</span>
            </label>

            <hr class="upo-divider" />

            <div class="upo-status-row">
                <span data-i18n="当前聊天">当前聊天</span>：
                <span id="upo_current_chat" class="upo-chat-name">—</span>
                <span id="upo_state" class="upo-state-badge upo-state-off">—</span>
            </div>

            <label class="checkbox_label" for="upo_enabled">
                <input id="upo_enabled" type="checkbox" />
                <span data-i18n="为当前聊天启用补充 Persona">为当前聊天启用补充 Persona</span>
            </label>

            <label class="upo-label" for="upo_nickname" data-i18n="备注名 / 昵称">备注名 / 昵称</label>
            <input id="upo_nickname" class="text_pole" type="text" maxlength="100" placeholder="留空则注入时写作 the user" />

            <label class="upo-label" for="upo_content" data-i18n="补充 Persona 内容">补充 Persona 内容</label>
            <textarea id="upo_content" class="text_pole upo-content" rows="6" placeholder="只对当前聊天生效的补充人设，例如身份、外貌、当前处境、与角色的关系等。"></textarea>
            <small class="upo-hint">提示：可尝试使用 \{{user}}、\{{char}} 等宏，是否生效以实际注入效果为准。</small>

            <label class="upo-label" for="upo_preview" data-i18n="注入内容预览">注入内容预览</label>
            <div class="upo-follow-row">
                <small id="upo_plan_info" class="upo-hint"></small>
                <input id="upo_follow_refresh" type="button" class="menu_button" value="刷新 Follow" data-i18n="刷新 Follow" />
            </div>
            <textarea id="upo_preview" class="text_pole upo-preview" rows="4" readonly></textarea>

            <small class="upo-hint" data-i18n="注入位置自动跟随原生 Persona（镜像）；无法镜像的类型会回退到本聊天保存的手动配置。">注入位置自动跟随原生 Persona（镜像）；无法镜像的类型会回退到本聊天保存的手动配置。</small>

            <hr class="upo-divider" />

            <label class="upo-label" data-i18n="Persona 存档">Persona 存档</label>
            <small class="upo-hint" data-i18n="存档保存在浏览器 localStorage，与各聊天数据互不影响；「应用」会把存档内容复制到当前聊天。">存档保存在浏览器 localStorage，与各聊天数据互不影响；「应用」会把存档内容复制到当前聊天。</small>
            <div class="upo-library-save">
                <input id="upo_lib_name" class="text_pole" type="text" maxlength="50" placeholder="存档名称（必填）" />
                <input id="upo_lib_save" type="button" class="menu_button" value="保存当前 Persona" data-i18n="保存当前 Persona" />
            </div>
            <div id="upo_lib_list" class="upo-library-list"></div>

            <div id="upo_lib_editor" class="upo-library-editor" style="display: none;">
                <small id="upo_lib_editor_hint" class="upo-hint"></small>
                <label class="upo-label" for="upo_lib_edit_name" data-i18n="存档名称">存档名称</label>
                <input id="upo_lib_edit_name" class="text_pole" type="text" maxlength="50" />
                <label class="upo-label" for="upo_lib_edit_nickname" data-i18n="备注名 / 昵称">备注名 / 昵称</label>
                <input id="upo_lib_edit_nickname" class="text_pole" type="text" maxlength="100" />
                <label class="upo-label" for="upo_lib_edit_content" data-i18n="补充 Persona 内容">补充 Persona 内容</label>
                <textarea id="upo_lib_edit_content" class="text_pole upo-content" rows="6"></textarea>
                <div class="upo-library-editor-actions">
                    <input id="upo_lib_edit_save" type="button" class="menu_button" value="保存修改" data-i18n="保存修改" />
                    <input id="upo_lib_edit_cancel" type="button" class="menu_button" value="关闭" data-i18n="关闭" />
                </div>
            </div>

            <hr class="upo-divider" />

            <label class="upo-label" data-i18n="悬浮窗">悬浮窗</label>
            <label class="upo-label" for="upo_floating_icon" data-i18n="悬浮图标">悬浮图标</label>
            <select id="upo_floating_icon" class="text_pole">
                <option value="kirimi">Kirimi 三文鱼（默认）</option>
                <option value="plain">简洁白底按钮</option>
            </select>
            <small class="upo-hint" data-i18n="自定义图片上传将在后续版本提供。">自定义图片上传将在后续版本提供。</small>

            <label class="upo-label" for="upo_floating_size" data-i18n="图标尺寸">图标尺寸</label>
            <select id="upo_floating_size" class="text_pole">
                <option value="small">小（44px）</option>
                <option value="medium">中（56px，默认）</option>
                <option value="large">大（72px）</option>
            </select>

            <small class="upo-hint">数据仅保存在当前聊天的元数据中，不同聊天互不影响；不会修改原生 Persona、角色卡或聊天消息。</small>
        </div>
    </div>
</div>
