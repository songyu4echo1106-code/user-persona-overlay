<div id="user_persona_overlay_settings" class="upo-container">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-i18n="User Persona Overlay">User Persona Overlay</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="upo-status-row">
                <span data-i18n="当前聊天">当前聊天</span>：
                <span id="upo_current_chat" class="upo-chat-name">—</span>
                <span id="upo_state" class="upo-state-badge upo-state-off">—</span>
            </div>

            <label class="checkbox_label" for="upo_enabled">
                <input id="upo_enabled" type="checkbox" />
                <span data-i18n="为当前聊天启用补充 Persona">为当前聊天启用补充 Persona</span>
            </label>

            <label class="upo-label" for="upo_nickname" data-i18n="备注名 / 昵称">备注名 / 昵称</label>
            <input id="upo_nickname" class="text_pole" type="text" maxlength="100" placeholder="留空则注入时写作 the user" />

            <label class="upo-label" for="upo_content" data-i18n="补充 Persona 内容">补充 Persona 内容</label>
            <textarea id="upo_content" class="text_pole upo-content" rows="6" placeholder="只对当前聊天生效的补充人设，例如身份、外貌、当前处境、与角色的关系等。"></textarea>
            <small class="upo-hint">提示：可尝试使用 \{{user}}、\{{char}} 等宏，是否生效以实际注入效果为准。</small>

            <label class="upo-label" for="upo_position" data-i18n="注入位置">注入位置</label>
            <select id="upo_position" class="text_pole">
                <option value="1">系统提示区（IN_PROMPT，与原生 Persona 同位）</option>
                <option value="2">聊天内指定深度（IN_CHAT）</option>
                <option value="3">提示词最前（BEFORE_PROMPT）</option>
                <option value="follow">跟随原生 Persona 位置（镜像）</option>
            </select>

            <div id="upo_depth_row" class="upo-depth-row">
                <label class="upo-label" for="upo_depth" data-i18n="注入深度">注入深度</label>
                <input id="upo_depth" class="text_pole upo-depth-input" type="number" min="0" max="999" step="1" />
                <small class="upo-hint" data-i18n="0 = 紧跟最后一条消息，数值越大位置越靠前。">0 = 紧跟最后一条消息，数值越大位置越靠前。</small>
            </div>

            <div id="upo_role_row">
                <label class="upo-label" for="upo_role" data-i18n="注入角色">注入角色</label>
                <select id="upo_role" class="text_pole">
                    <option value="0">System</option>
                    <option value="1">User</option>
                    <option value="2">Assistant</option>
                </select>
            </div>

            <label class="upo-label" for="upo_preview" data-i18n="注入内容预览">注入内容预览</label>
            <small id="upo_plan_info" class="upo-hint"></small>
            <textarea id="upo_preview" class="text_pole upo-preview" rows="4" readonly></textarea>

            <small class="upo-hint">数据仅保存在当前聊天的元数据中，不同聊天互不影响；不会修改原生 Persona、角色卡或聊天消息。</small>
        </div>
    </div>
</div>
